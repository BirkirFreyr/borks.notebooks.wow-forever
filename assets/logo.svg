<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- backdrop -->
  <rect width="512" height="512" rx="72" fill="#1f2a44"/>
  <!-- notebook shadow -->
  <rect x="120" y="76" width="288" height="372" rx="22" fill="#141c30"/>
  <!-- cover -->
  <rect x="104" y="60" width="288" height="372" rx="22" fill="#b5532f"/>
  <rect x="104" y="60" width="52" height="372" rx="22" fill="#8f3e22"/>
  <rect x="134" y="60" width="22" height="372" fill="#8f3e22"/>
  <!-- pages -->
  <rect x="176" y="88" width="196" height="316" rx="10" fill="#f4e9cf"/>
  <rect x="176" y="88" width="196" height="316" rx="10" fill="none" stroke="#d9c8a0" stroke-width="4"/>
  <!-- ruled lines: a subject line, then body lines -->
  <rect x="200" y="124" width="120" height="14" rx="7" fill="#b5532f"/>
  <rect x="200" y="168" width="148" height="8" rx="4" fill="#c9b78c"/>
  <rect x="200" y="200" width="148" height="8" rx="4" fill="#c9b78c"/>
  <rect x="200" y="232" width="148" height="8" rx="4" fill="#c9b78c"/>
  <rect x="200" y="264" width="148" height="8" rx="4" fill="#c9b78c"/>
  <rect x="200" y="296" width="96" height="8" rx="4" fill="#c9b78c"/>
  <!-- binding rings -->
  <g fill="#e7c15a" stroke="#8a6a1d" stroke-width="4">
    <rect x="124" y="108" width="64" height="20" rx="10"/>
    <rect x="124" y="168" width="64" height="20" rx="10"/>
    <rect x="124" y="228" width="64" height="20" rx="10"/>
    <rect x="124" y="288" width="64" height="20" rx="10"/>
    <rect x="124" y="348" width="64" height="20" rx="10"/>
  </g>
  <!-- bookmark ribbon -->
  <path d="M330 60 h40 v118 l-20 -20 l-20 20 z" fill="#e7c15a" stroke="#8a6a1d" stroke-width="4" stroke-linejoin="round"/>
  <!-- pencil -->
  <g transform="rotate(38 380 380)">
    <rect x="352" y="250" width="56" height="190" rx="6" fill="#f2b632" stroke="#8a5d0b" stroke-width="4"/>
    <rect x="352" y="250" width="56" height="34" rx="6" fill="#d96a6a" stroke="#8a5d0b" stroke-width="4"/>
    <rect x="352" y="284" width="56" height="14" fill="#c9ced6" stroke="#8a5d0b" stroke-width="4"/>
    <path d="M352 440 h56 l-28 52 z" fill="#f4e9cf" stroke="#8a5d0b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M370 470 h20 l-10 22 z" fill="#2b2b2b"/>
  </g>
</svg>
