name: Check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The game uses plain Lua 5.1, which is stricter than LuaJIT about some syntax.
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: luac5.1 -p Notebook.lua
