name: Package and release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write # lets the packager create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag only releases if its commit is on main or a release/v* branch
      # (release branches are for backports and hotfixes to older versions).
      - name: Check the tag is on main or a release branch
        run: |
          commit=$(git rev-parse "HEAD^{commit}")
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/v*'); do
            if git merge-base --is-ancestor "$commit" "$ref"; then
              echo "Tagged commit $commit is on ${ref#refs/remotes/origin/}"
              exit 0
            fi
          done
          echo "::error::Tagged commit $commit is not on main or a release/v* branch; refusing to release."
          exit 1
      - uses: BigWigsMods/packager@v2
